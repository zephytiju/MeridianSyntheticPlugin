# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.3.0 hatchling==1.27.0 twine==6.1.0
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/build_sbom.py dist/*.whl dist/meridian-storage-plugin-synthetic-1.0.1.spdx.json
      - run: cp evidence/conformance-report.json dist/conformance-report.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish ordinary public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
