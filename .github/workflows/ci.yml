# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install released Meridian V1 artifacts
        run: |
          python -m pip install \
            https://github.com/zephytiju/MeridianCore/releases/download/v1.0.0/meridian_storage_core-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianSemantics/releases/download/v1.0.0/meridian_storage_semantics-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianQuery/releases/download/v1.0.0/meridian_storage_query-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianEvidence/releases/download/v1.0.0/meridian_storage_evidence-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianStreaming/releases/download/v1.0.0/meridian_storage_streaming-1.0.0-py3-none-any.whl
      - name: Install package and pinned verification tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install \
            build==1.3.0 hatchling==1.27.0 hypothesis==6.138.3 \
            jsonschema==4.25.1 mypy==1.17.1 pip-audit==2.9.0 \
            pytest==9.0.3 pytest-cov==6.2.1 ruff==0.12.11 twine==6.1.0
      - name: Boundaries
        run: python scripts/check_boundaries.py
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy src
      - name: Tests and deterministic coverage evidence
        run: pytest --cov=meridian_storage.plugins.synthetic --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: coverage-python-3.13
          path: coverage.xml

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build==1.3.0 hatchling==1.27.0 twine==6.1.0
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/build_sbom.py dist/*.whl dist/meridian-storage-plugin-synthetic-1.0.1.spdx.json
      - run: cp evidence/conformance-report.json dist/conformance-report.json
      - name: Verify one distribution and Apache material
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          unzip -l dist/*.whl | grep 'LICENSE'
          unzip -l dist/*.whl | grep 'NOTICE'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the audited release and verification set
        run: |
          python -m pip install pip==26.2.1
          python -m pip install \
            https://github.com/zephytiju/MeridianCore/releases/download/v1.0.0/meridian_storage_core-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianSemantics/releases/download/v1.0.0/meridian_storage_semantics-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianQuery/releases/download/v1.0.0/meridian_storage_query-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianEvidence/releases/download/v1.0.0/meridian_storage_evidence-1.0.0-py3-none-any.whl \
            https://github.com/zephytiju/MeridianStreaming/releases/download/v1.0.0/meridian_storage_streaming-1.0.0-py3-none-any.whl
          python -m pip install \
            build==1.3.0 hatchling==1.27.0 hypothesis==6.138.3 \
            jsonschema==4.25.1 mypy==1.17.1 pip-audit==2.9.0 \
            pytest==9.0.3 pytest-cov==6.2.1 ruff==0.12.11 twine==6.1.0
      - name: Audit the installed dependency set
        run: pip-audit --local --skip-editable
