# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-plugin-synthetic"
version = "1.0.0"
description = "Deterministic, schema-driven synthetic data generation for Meridian V1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
keywords = ["meridian", "synthetic-data", "fixtures", "streaming", "testing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "meridian-storage-core==1.0.0",
  "meridian-storage-evidence==1.0.0",
  "meridian-storage-query==1.0.0",
  "meridian-storage-semantics==1.0.0",
  "meridian-storage-streaming==1.0.0",
]

[project.optional-dependencies]
test = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "hypothesis==6.138.3",
  "jsonschema==4.25.1",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "twine==6.1.0",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianSyntheticPlugin#readme"
Issues = "https://github.com/zephytiju/MeridianSyntheticPlugin/issues"
Repository = "https://github.com/zephytiju/MeridianSyntheticPlugin"

[project.entry-points."meridian_storage.plugins"]
synthetic = "meridian_storage.plugins.synthetic.plugin:SyntheticPluginFactory"

[tool.hatch.build]
include = [
  "src/meridian_storage/plugins/synthetic/**",
  "contracts/**",
  "docs/**",
  "compatibility.json",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "meridian_storage/plugins/synthetic/contracts"
"compatibility.json" = "meridian_storage/plugins/synthetic/compatibility.json"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/compatibility.json",
  "/contracts",
  "/docs",
  "/evidence",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "contract: serialized public contract verification",
  "conformance: cross-package Meridian conformance verification",
  "integration: released-artifact integration verification",
  "packaging: built-artifact and clean-install verification",
  "property: deterministic property-based verification",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.plugins.synthetic"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]
ignore = [
  "N818",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "S105",
  "S112",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.plugins.synthetic"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
